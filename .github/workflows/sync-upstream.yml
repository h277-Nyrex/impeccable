name: Sync upstream

on:
  schedule:
    - cron: "23 19 * * *"   # 04:23 JST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `archive` is append-only and never force-pushed. Every run merges the
      # previous main tip into it, so upstream history rewrites (force-push,
      # orphan rebuild, filter-repo) cannot orphan anything we have seen.
      - name: Archive previous main
        run: |
          prev=$(git rev-parse main)
          if git ls-remote --exit-code --heads origin archive >/dev/null 2>&1; then
            git fetch origin archive
            git checkout -B archive origin/archive
          else
            git checkout -B archive "$prev"
          fi
          git merge -s ours --no-edit -m "archive: preserve main@$prev" "$prev"
          git push origin archive

      # main is a plain mirror of upstream: reset instead of rebase, so an
      # upstream rewrite never replays our history and never conflicts.
      - name: Reset main to upstream
        run: |
          git fetch https://github.com/pbakaus/impeccable.git main --tags --force
          git checkout -B main FETCH_HEAD
          git checkout archive -- .github/workflows/sync-upstream.yml
          git add -A
          git commit -m "ci: mirror upstream@$(git rev-parse --short FETCH_HEAD)" || true

      - name: Push
        run: git push origin main --force-with-lease --tags
